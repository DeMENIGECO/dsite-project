<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DSite</title>

<!-- Markdown parser -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{
    --main:#40e0d0;
    --dark:#2bbbad;
    --light:#e8ffff;
    --text:#183030;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:white;
    color:var(--text);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;

    background:var(--main);
    color:white;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 25px;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

/* DESKTOP MENU */

.desktop-menu{
    display:flex;
    gap:15px;
}

.desktop-menu a{
    text-decoration:none;
    color:white;
    font-weight:bold;
    padding:10px 14px;
    border-radius:10px;
    transition:0.2s;
}

.desktop-menu a:hover{
    background:rgba(255,255,255,0.2);
}

/* MOBILE */

.hamburger{
    display:none;
    font-size:30px;
    cursor:pointer;
}

.mobile-menu{
    display:none;
    flex-direction:column;

    background:var(--dark);

    padding:10px;
}

.mobile-menu a{
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,0.15);
}

/* CONTENT */

main{
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

#markdown-content{
    background:white;
    border-radius:20px;
    padding:30px;

    box-shadow:0 0 20px rgba(0,0,0,0.08);
}

/* Markdown */

#markdown-content h1,
#markdown-content h2,
#markdown-content h3{
    margin-top:25px;
    margin-bottom:15px;
    color:var(--dark);
}

#markdown-content p{
    line-height:1.7;
    margin-bottom:15px;
}

#markdown-content code{
    background:#f0f0f0;
    padding:3px 6px;
    border-radius:6px;
}

#markdown-content pre{
    background:#202020;
    color:white;
    padding:15px;
    border-radius:12px;
    overflow:auto;
    margin-bottom:20px;
}

/* FOOTER */

footer{
    margin-top:50px;

    background:var(--main);
    color:white;

    padding:25px;

    display:flex;
    flex-wrap:wrap;
    gap:20px;

    align-items:center;
    justify-content:space-between;
}

.footer-group{
    display:flex;
    align-items:center;
    gap:10px;
}

select{
    padding:8px 12px;
    border:none;
    border-radius:10px;
}

/* RESPONSIVE */

@media(max-width:800px){

    .desktop-menu{
        display:none;
    }

    .hamburger{
        display:block;
    }

}
</style>
</head>
<body>

<header>

    <div class="logo">
        DSite
    </div>

    <!-- Desktop Menu -->
    <nav class="desktop-menu">
        <a href="#">Home</a>
        <a href="#">Docs</a>
        <a href="#">FAQ</a>
        <a href="#">GitHub</a>
    </nav>

    <!-- Mobile Hamburger -->
    <div class="hamburger" onclick="toggleMenu()">
        ☰
    </div>

</header>

<!-- Mobile Menu -->
<nav class="mobile-menu" id="mobileMenu">
    <a href="#">Home</a>
    <a href="#">Docs</a>
    <a href="#">FAQ</a>
    <a href="#">GitHub</a>
</nav>

<main>

    <!-- Markdown Render -->
    <div id="markdown-content">
        Caricamento documentazione...
    </div>

</main>

<footer>

    <div class="footer-group">
        <span>🌍 Lingua:</span>

        <select id="languageSelect">
            <option value="it">Italiano</option>
            <option value="en">English</option>
        </select>
    </div>

    <div class="footer-group">
        <span>🚀 Versione:</span>

        <select id="versionSelect">
            <option value="1.0.0">1.0.0</option>
        </select>
    </div>

</footer>

<script>

/* MOBILE MENU */

function toggleMenu(){

    const menu = document.getElementById("mobileMenu");

    if(menu.style.display === "flex"){
        menu.style.display = "none";
    }else{
        menu.style.display = "flex";
    }

}

/* MARKDOWN FILE */

fetch("homepage.md")
.then(response => response.text())
.then(markdown => {

    document.getElementById("markdown-content").innerHTML =
        marked.parse(markdown);

})
.catch(error => {

    document.getElementById("markdown-content").innerHTML =
        "<h2>Errore caricamento Markdown</h2>";

    console.error(error);

});

/* FOOTER SELECTORS */

const langSelect = document.getElementById("languageSelect");
const versionSelect = document.getElementById("versionSelect");

function updateURL(){

    const lang = langSelect.value;
    const version = versionSelect.value;

    const newURL = `/dsite-project/${lang}/${version}/`;

    window.location.href = newURL

}

langSelect.addEventListener("change", updateURL);
versionSelect.addEventListener("change", updateURL);

</script>

</body>
</html>
